<!-- map-fullscreen v1 -->
<style id="mfs-style">
.mfs-btn{position:absolute;top:10px;right:10px;z-index:1001;width:34px;height:34px;border:2px solid rgba(0,0,0,.25);border-radius:4px;background:#fff;color:#222;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mfs-btn:hover{background:#f2f2f2}
.mfs-btn svg{width:18px;height:18px}
.mfs-host.mfs-btn-left .mfs-btn{right:auto;left:54px}
.mfs-fake{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;z-index:100000!important;border-radius:0!important}
html.mfs-lock,html.mfs-lock body{overflow:hidden!important}
:fullscreen.mfs-host{width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;margin:0!important;border-radius:0!important}
</style>
<script id="mfs-script">
(function(){
  var ICON_OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var ICON_CLOSE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  function poke(){setTimeout(function(){window.dispatchEvent(new Event('resize'));},60);setTimeout(function(){window.dispatchEvent(new Event('resize'));},400);}
  function realFS(){return document.fullscreenElement||document.webkitFullscreenElement;}
  function add(el){
    if(el.__mfs)return; el.__mfs=1;
    var cs=getComputedStyle(el); if(cs.position==='static')el.style.position='relative';
    el.classList.add('mfs-host');
    // avoid clashing with a top-right Leaflet control (e.g. "Map layers")
    var tr=el.querySelector('.leaflet-top.leaflet-right');
    if(tr&&tr.children.length){ el.classList.add('mfs-btn-left'); }
    var b=document.createElement('button'); b.type='button'; b.className='mfs-btn';
    b.title='Full screen map'; b.setAttribute('aria-label','Full screen map'); b.innerHTML=ICON_OPEN;
    ['click','dblclick','mousedown','touchstart','wheel'].forEach(function(t){b.addEventListener(t,function(e){e.stopPropagation();},{passive:t!=='click'});});
    function setIcon(on){b.innerHTML=on?ICON_CLOSE:ICON_OPEN;b.title=on?'Exit full screen':'Full screen map';b.setAttribute('aria-label',b.title);}
    function exitFake(){el.classList.remove('mfs-fake');document.documentElement.classList.remove('mfs-lock');setIcon(false);poke();}
    b.addEventListener('click',function(e){
      e.preventDefault();
      if(el.classList.contains('mfs-fake')){exitFake();return;}
      if(realFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
      var req=el.requestFullscreen||el.webkitRequestFullscreen;
      if(req){ try{ var p=req.call(el); if(p&&p.catch)p.catch(function(){el.classList.add('mfs-fake');document.documentElement.classList.add('mfs-lock');setIcon(true);poke();}); }catch(err){el.classList.add('mfs-fake');document.documentElement.classList.add('mfs-lock');setIcon(true);poke();} }
      else { el.classList.add('mfs-fake');document.documentElement.classList.add('mfs-lock');setIcon(true);poke(); }
    });
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&el.classList.contains('mfs-fake'))exitFake();});
    ['fullscreenchange','webkitfullscreenchange'].forEach(function(t){document.addEventListener(t,function(){setIcon(realFS()===el);poke();});});
    el.appendChild(b);
  }
  function scan(){
    var els=document.querySelectorAll('[data-fullscreen-map], .leaflet-container, .maplibregl-map, .mapboxgl-map');
    els.forEach(function(el){
      if(el.closest('.mfs-host')&&!el.classList.contains('mfs-host'))return;
      var r=el.getBoundingClientRect(); if(r.width<200||r.height<150)return;
      add(el);
    });
  }
  function start(){scan(); var n=0; var t=setInterval(function(){scan(); if(++n>20)clearInterval(t);},500);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
<!-- /map-fullscreen -->
